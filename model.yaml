# yaml-language-server: $schema=packages/rules-schema/schemas/model.schema.json
# Every threshold of the model lives here, never in code (RN-23).
# Changing a value requires the reference-pool ranking diff in the PR (RN-24).
schema_version: 1
version: "0.2.0"

synergy:
  alpha_rules: 0.7            # RN-25
  k: 30                       # RN-27
  semantic_calibration: percentile   # RN-26
  pair_affinity: { asks_gives: 1.0, same_direction: 0.5 }

semantic:                     # RN-25, RN-26 · built by `pnpm data:embed`
  model: Xenova/all-MiniLM-L6-v2   # open model (Apache-2.0), runs locally via transformers.js
  dimensions: 128             # after PCA; 384 → 128 keeps similarities, cuts size by 3
  batch_size: 64
  calibration_sample: 4000    # cards per commander used to estimate its similarity distribution

lands:                        # RN-44 (commander_v0)
  base: 36
  mv_reference: 3.0
  mv_slope: 3
  cheap_ramp_max_mv: 2
  cheap_ramp_discount: 0.33
  mdfc_land_value: 0.5        # RN-47

utility:
  useful_threshold: 0.5       # RN-31

theme_support:                # RN-33
  min_cards: 8
  floor_multiplier: 0.5

confidence:                   # RN-34, RN-35
  high_min_rule_weight: 0.5
  low_redistribute_to: [skeleton, utility]

profiles:                     # RN-36
  default:       { synergy: 0.45, skeleton: 0.30, utility: 0.25 }
  max_synergy:   { synergy: 0.65, skeleton: 0.20, utility: 0.15 }
  ready_to_play: { synergy: 0.20, skeleton: 0.35, utility: 0.45 }

tiebreak: [synergy, missing_asc, name]   # RN-37

limits:
  pair_candidates: 15         # RN-63
  weak_score: 40              # RN-60
  gap_min_cards: 15           # RN-61
  small_pool: 30              # RN-62
